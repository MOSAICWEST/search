<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOSAIC 재고 검색</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* 공통 스타일 */
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fafafa;
      color: #1f1f1f;
    }
    h1 {
      text-align: center;
      margin: 30px 0 10px;
      font-size: 28px;
      font-weight: 600;
    }

    /* 페이지 제목 + 언어 전환 */
    .language-switch {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin: 0 0 18px;
    }
    .language-switch button {
      border: 0;
      background: transparent;
      color: #999;
      padding: 4px 7px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .5px;
      cursor: pointer;
    }
    .language-switch button:hover {
      background: #f0f0f0;
      color: #333;
    }
    .language-switch button.active {
      color: #111;
      background: #ececec;
    }
    .language-switch .divider {
      color: #d0d0d0;
      font-size: 11px;
      user-select: none;
    }

    @media (max-width: 600px) {
      h1 { font-size: 24px; }
      .language-switch { margin-bottom: 14px; }
    }

    select, input[type="text"], button {
      font-size: 16px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    input[type="text"]:focus, select:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0,113,227,0.2);
    }
    button {
      background-color: #333;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background-color: #555; }
    button:disabled {
      background-color: #ccc;
      color: #666;
      cursor: default;
    }

    /* 검색 및 필터 영역 */
    .search-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 5% 18px;
    }
    .search-panel {
      width: min(920px, 100%);
      display: flex;
      flex-direction: column;
      gap: 13px;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .search-main {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .search-main input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      background: #fff;
    }
    .search-main button {
      min-width: 78px;
      padding-left: 18px;
      padding-right: 18px;
    }

    /* 네비게이션형 필터
       - 데스크톱: 마우스를 올리면 목록 표시
       - 모바일/터치: 클릭하여 열고 닫기
       - 실제 필터 값은 숨겨진 native select와 동기화 */
    .filters-native {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
      pointer-events: none !important;
    }
    .filter-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0;
      min-height: 38px;
      position: relative;
      z-index: 40;
    }
    .filter-nav-item {
      position: relative;
      display: flex;
      align-items: center;
    }
    .filter-nav-separator {
      color: #d0d0d0;
      font-size: 18px;
      font-weight: 400;
      line-height: 1;
      margin: 0 5px;
      user-select: none;
    }
    .filter-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 36px;
      padding: 5px 4px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #777;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: none;
    }
    .filter-trigger:hover,
    .filter-nav-item.open .filter-trigger,
    .filter-nav-item.has-selection .filter-trigger {
      background: transparent;
      color: #111;
    }
    /* Apple 스타일의 미니멀 chevron */
    .filter-chevron {
      width: 8px;
      height: 8px;
      display: inline-block;
      flex: 0 0 8px;
      margin: -3px 3px 0 2px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      color: #86868b;
      font-size: 0;
      line-height: 0;
      transform: rotate(45deg);
      transform-origin: 55% 55%;
      transition: transform .22s cubic-bezier(.2,.8,.2,1), color .18s ease;
    }
    .filter-nav-item.open .filter-chevron {
      transform: rotate(225deg);
      color: #1d1d1f;
    }

    .filter-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 210px;
      max-width: min(320px, calc(100vw - 32px));
      max-height: 330px;
      overflow-y: auto;
      padding: 8px;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      background: rgba(255,255,255,.94);
      -webkit-backdrop-filter: saturate(180%) blur(22px);
      backdrop-filter: saturate(180%) blur(22px);
      box-shadow: 0 14px 40px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.04);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-5px) scale(.985);
      transform-origin: top center;
      transition: opacity .16s ease, transform .18s cubic-bezier(.2,.8,.2,1), visibility .16s ease;
      z-index: 80;
    }
    .filter-nav-item.open .filter-dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    .filter-dropdown button {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: #6e6e73;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      text-align: left;
      white-space: normal;
      cursor: pointer;
      transition: background-color .12s ease, color .12s ease;
    }
    .filter-dropdown button:hover,
    .filter-dropdown button:focus-visible {
      background: rgba(0,0,0,.045);
      color: #1d1d1f;
      outline: none;
    }
    .filter-dropdown button.active {
      background: rgba(0,0,0,.055);
      color: #1d1d1f;
      font-weight: 650;
    }

    /* Genre: desktop에서는 7" / LP·12" 두 영역으로 분리 */
    #genreFilterNav .filter-dropdown {
      left: 50%;
      width: min(620px, calc(100vw - 40px));
      min-width: 520px;
      max-width: calc(100vw - 40px);
      max-height: 430px;
      transform: translate(-50%, -5px) scale(.985);
      overflow-y: auto;
    }
    #genreFilterNav.open .filter-dropdown {
      transform: translate(-50%, 0) scale(1);
    }
    .genre-all-wrap {
      padding-bottom: 7px;
      margin-bottom: 7px;
      border-bottom: 1px solid rgba(0,0,0,.07);
    }
    .genre-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 0;
    }
    .genre-column {
      min-width: 0;
      padding: 3px 8px 6px;
    }
    .genre-column + .genre-column {
      border-left: 1px solid rgba(0,0,0,.07);
    }
    .genre-group-title {
      padding: 7px 12px 8px;
      color: #a1a1a6;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .08em;
      text-transform: uppercase;
      user-select: none;
    }

    @media (hover: hover) and (pointer: fine) and (min-width: 601px) {
      .filter-nav-item:not(.click-only):hover .filter-dropdown,
      .filter-nav-item:not(.click-only):focus-within .filter-dropdown {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }
      #genreFilterNav:hover .filter-dropdown,
      #genreFilterNav:focus-within .filter-dropdown {
        transform: translate(-50%, 0) scale(1);
      }
      .filter-nav-item:not(.click-only):hover .filter-chevron,
      .filter-nav-item:not(.click-only):focus-within .filter-chevron {
        transform: rotate(225deg);
        color: #1d1d1f;
      }
      .filter-nav-item:not(.click-only):hover .filter-trigger,
      .filter-nav-item:not(.click-only):focus-within .filter-trigger {
        color: #111;
      }
    }
    .result-summary {
      width: 95%;
      margin: 0 auto 12px;
      font-size: 13px;
      color: #666;
      min-height: 20px;
    }
    .result-summary strong {
      color: #111;
      font-weight: 600;
    }

    /* 테이블 영역 */
    .table-wrapper {
      overflow-x: auto;
      margin: 0 auto 60px;
      width: 95%;
      animation: fadeIn 0.4s ease-in;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background-color: #fff;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      background-color: #f7f7f7;
      position: static;
      white-space: nowrap;
    }

    /* 스크롤 시에만 나타나는 데스크톱 고정 헤더 */
    .floating-table-header {
      display: none;
      position: fixed;
      top: 0;
      z-index: 900;
      overflow: hidden;
      background: #f7f7f7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
      pointer-events: none;
    }
    .floating-table-header.visible { display: block; }
    .floating-table-header table {
      margin: 0;
      width: auto;
      table-layout: fixed;
      background: #fff;
    }
    .floating-table-header th {
      background: #f7f7f7;
    }

    tbody tr:nth-child(odd) { background-color: #fcfcfc; }
    tbody tr:hover { background-color: #eef6ff; }

    /* 데스크톱 이미지 셀 */
    td.image-cell {
      width: 110px;
      min-width: 110px;
    }
    .table-image {
      width: 90px;
      height: 90px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }
    .table-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .table-image .no-image {
      color: #aaa;
      font-size: 12px;
    }

    /* 상품 위치 뱃지 */
    .image-badge-wrap {
      position: relative;
    }

    .store-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      line-height: 20px;
      text-align: center;
      letter-spacing: 0.2px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 2;
    }

    .card-image.image-badge-wrap .store-badge {
      top: 6px;
      left: 6px;
    }

    /* 최근 업데이트: 클릭하면 기존 날짜 칩 바가 아래에 펼쳐지는 토글 구조 */
    #dateFilterNav.date-expanded .filter-chevron {
      transform: rotate(225deg);
      color: #1d1d1f;
    }
    #dateFilterNav.date-expanded .filter-trigger {
      color: #111;
    }

    .date-filter-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 95%;
      max-height: 0;
      margin: 0 auto;
      opacity: 0;
      overflow: hidden;
      visibility: hidden;
      transform: translateY(-4px);
      transition: max-height .24s cubic-bezier(.2,.8,.2,1),
                  opacity .18s ease,
                  transform .22s cubic-bezier(.2,.8,.2,1),
                  margin .22s ease,
                  visibility .18s ease;
    }
    .date-filter-bar.is-open {
      max-height: 180px;
      margin-top: 5px;
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      overflow: visible;
    }
    .date-filter-bar button {
      background-color: #f2f2f2;
      border: 1px solid #ccc;
      color: #333;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.2;
      cursor: pointer;
      box-shadow: none;
      transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    }
    .date-filter-bar button:hover,
    .date-filter-bar button:focus-visible {
      background-color: #e0e0e0;
      outline: none;
    }
    .date-filter-bar button.active {
      background-color: #0071e3;
      border-color: #0071e3;
      color: #fff;
    }

    /* 검색어는 유지하고 필터만 초기화하는 Apple식 아이콘 버튼 */
    .filter-reset-btn {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 32px;
      border: 0;
      background: transparent;
      color: #8e8e93;
      padding: 0;
      margin-left: 8px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: none;
      transition: background-color .15s ease, color .15s ease, transform .15s ease;
    }
    .filter-reset-btn svg {
      width: 17px;
      height: 17px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .filter-reset-btn:hover,
    .filter-reset-btn:focus-visible {
      background: rgba(0,0,0,.055);
      color: #1d1d1f;
      outline: none;
    }
    .filter-reset-btn:active {
      transform: scale(.94);
    }

    /* =========================
       Floating Utility Bar
       - 모바일 / 태블릿 / 데스크톱 공통
       - 상단에서는 CART만 표시
       - 스크롤 후 ↑ 표시
       - 모바일에서 페이지네이션이 화면에 들어오면 CART만 남기고 자동 회피
       ========================= */
    .utility-bar {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 250;
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 4px;
      border: 1px solid rgba(0,0,0,.10);
      border-radius: 999px;
      background: rgba(250,250,252,.90);
      -webkit-backdrop-filter: blur(16px) saturate(150%);
      backdrop-filter: blur(16px) saturate(150%);
      box-shadow:
        0 8px 24px rgba(0,0,0,.10),
        0 1px 3px rgba(0,0,0,.06);
      transition:
        bottom .22s ease,
        transform .22s ease,
        opacity .20s ease,
        box-shadow .18s ease,
        background-color .18s ease;
    }
    .utility-bar:hover {
      background: rgba(255,255,255,.95);
      box-shadow:
        0 10px 28px rgba(0,0,0,.12),
        0 1px 4px rgba(0,0,0,.07);
    }
    .utility-segment {
      height: 36px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: #35383d;
      font-family: inherit;
      font-size: 13px;
      font-weight: 650;
      line-height: 1;
      cursor: pointer;
      transition:
        width .20s ease,
        padding .20s ease,
        opacity .16s ease,
        background-color .16s ease,
        color .16s ease,
        transform .12s ease;
    }
    .utility-segment:hover {
      background: rgba(0,0,0,.055);
      color: #1d1d1f;
    }
    .utility-segment:active {
      transform: scale(.97);
    }

    .utility-top {
      width: 0;
      padding: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      font-size: 18px;
      font-weight: 500;
    }
    .utility-divider {
      width: 0;
      height: 20px;
      margin: 0;
      overflow: hidden;
      opacity: 0;
      background: rgba(0,0,0,.12);
      transition:
        width .20s ease,
        margin .20s ease,
        opacity .16s ease;
    }
    .utility-bar.show-top .utility-top {
      width: 38px;
      padding: 0 8px;
      opacity: 1;
      pointer-events: auto;
    }
    .utility-bar.show-top .utility-divider {
      width: 1px;
      margin: 0 2px;
      opacity: 1;
    }

    .utility-cart {
      min-width: 82px;
      padding: 0 11px;
      white-space: nowrap;
    }
    .utility-cart .cart-count {
      min-width: 20px;
      height: 20px;
      margin-left: 5px;
      padding: 0 6px;
      background: #4b5563;
      color: #fff;
      line-height: 20px;
      box-shadow: none;
    }
    .utility-cart.count-pop {
      animation: utilityCartPop .22s ease;
    }
    @keyframes utilityCartPop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    /* 모바일/태블릿 자동 숨김
       활동 중에는 표시되고, 잠시 정지하면 화면 아래쪽으로 부드럽게 사라짐 */
    @media (max-width: 1024px) {
      .utility-bar.auto-hidden {
        opacity: 0;
        transform: translateY(16px) scale(.98);
        pointer-events: none;
      }
    }

    /* 태블릿 */
    @media (min-width: 601px) and (max-width: 1024px) {
      .utility-bar {
        right: 18px;
        bottom: 20px;
      }
    }

    /* 모바일
       기존 + 버튼처럼 화면 하단에서 약간 띄워 페이지 이동 영역과 거리를 둠 */
    @media (max-width: 600px) {
      .utility-bar {
        right: 14px;
        bottom: var(--utility-mobile-bottom, calc(86px + env(safe-area-inset-bottom)));
        min-height: 42px;
        padding: 3px;
        max-width: calc(100vw - 28px);
      }
      .utility-segment {
        height: 36px;
        font-size: 12px;
      }
      .utility-bar.show-top .utility-top {
        width: 36px;
        padding: 0 7px;
      }
      .utility-cart {
        min-width: 76px;
        padding: 0 10px;
      }

      /* 페이지네이션이 보일 때는 TOP을 감추고 CART만 최소 크기로 유지 */
      .utility-bar.pagination-near .utility-top {
        width: 0 !important;
        padding: 0 !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      .utility-bar.pagination-near .utility-divider {
        width: 0 !important;
        margin: 0 !important;
        opacity: 0 !important;
      }
      .utility-bar.pagination-near .utility-cart {
        min-width: 72px;
        padding-left: 9px;
        padding-right: 9px;
      }
    }

    /* 모달 영역 */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 24px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 10px;
      position: relative;
      animation: slideUp 0.3s ease forwards;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-close {
      position: absolute; top: 12px; right: 16px;
      font-size: 24px; cursor: pointer; color: #666; transition: color 0.3s;
    }
    .modal-close:hover { color: #000; }

    /* 모달이 열린 동안 뒤쪽 페이지 스크롤 방지 */
    body.modal-open {
      overflow: hidden;
      overscroll-behavior: none;
    }

    /*
      상품 상세 모달:
      modal-content 자체는 고정하고 실제 스크롤은 #modalBody에서만 수행.
      따라서 X 버튼은 스크롤 위치와 무관하게 항상 노출됨.
    */
    #detailModal .modal-content {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 90vh;
      max-height: 90dvh;
    }
    #detailModal #modalBody {
      flex: 1 1 auto;
      min-height: 0;
      max-height: 90vh;
      max-height: 90dvh;
      overflow-y: auto;
      padding: 24px;

        margin-right: auto;

        font-size: 14px;

      #scopeFilterNav .filter-trigger-label { max-width: 68px; }

        width: 28px;
        height: 28px;

        margin-left: 3px;

      .filter-reset-btn svg {
        width: 15px;
        height: 15px;
      }
      .date-filter-bar {
        max-width: 100%;
        gap: 6px;
      }
      .date-filter-bar.is-open {
        max-height: 220px;
        margin-top: 6px;
      }
      .date-filter-bar button {
        padding: 6px 10px;
        font-size: 12px;
      }
      .filter-chevron {
        width: 7px;
        height: 7px;
        flex-basis: 7px;
        margin-left: 2px;
        margin-right: 3px;
      }
      /* 모바일 드롭다운은 필터 위치에 맞춰 화면 안쪽으로 열리도록 정렬 */
      .filter-dropdown {
        width: auto;
        max-width: calc(100vw - 24px);
        max-height: min(68vh, 430px);
      }

      /* 두 번째: 매장 필터 → 왼쪽 기준으로 열기 */
      #storeFilterNav .filter-dropdown {
        left: 0;
        right: auto;
        min-width: 200px;
        width: max-content;
        max-width: calc(100vw - 24px);
        transform: translateY(-5px) scale(.985);
        transform-origin: top left;
      }

      /* 가운데: 장르 필터 → 화면 중앙 쪽으로 열기 */
      #genreFilterNav .filter-dropdown {
        left: 50%;
        right: auto;
        width: min(360px, calc(100vw - 24px));
        min-width: min(320px, calc(100vw - 24px));
        max-width: calc(100vw - 24px);
        transform: translate(-50%, -5px) scale(.985);
        transform-origin: top center;
      }

      /* 마지막: 검색 항목 필터 → 오른쪽 기준으로 열기 */
      #scopeFilterNav .filter-dropdown {
        left: auto;
        right: 0;
        min-width: 210px;
        width: max-content;
        max-width: calc(100vw - 24px);
        transform: translateY(-5px) scale(.985);
        transform-origin: top right;
      }

      #storeFilterNav.open .filter-dropdown,
      #scopeFilterNav.open .filter-dropdown {
        transform: translateY(0) scale(1);
      }
      #genreFilterNav.open .filter-dropdown {
        transform: translate(-50%, 0) scale(1);
      }
      .filter-dropdown button {
        padding: 11px 13px;
        font-size: 14px;
      }
      .genre-grid {
        grid-template-columns: 1fr;
      }
      .genre-column {
        padding: 2px 4px 5px;
      }
      .genre-column + .genre-column {
        border-left: 0;
        border-top: 1px solid rgba(0,0,0,.07);
        margin-top: 6px;
        padding-top: 8px;
      }
      .genre-group-title {
        padding: 7px 10px 6px;
      }
      .result-summary { width: 90%; margin-bottom: 10px; }
      .floating-table-header { display: none !important; }
    }

    /* 360px 이하의 작은 화면에서는 구분자와 텍스트를 한 단계 더 압축 */
    @media (max-width: 360px) {
      .filter-nav-separator {
        margin: 0 1px;
        font-size: 11px;
      }
      .filter-trigger {
        gap: 2px;
        font-size: 11px;
      }
      #dateFilterNav .filter-trigger-label { max-width: 62px; }
      #storeFilterNav .filter-trigger-label,
      #genreFilterNav .filter-trigger-label,
      #scopeFilterNav .filter-trigger-label { max-width: 54px; }
      .filter-chevron {
        width: 6px;
        height: 6px;
        flex-basis: 6px;
        margin-left: 1px;
        margin-right: 1px;
      }
      .filter-reset-btn {
        width: 26px;
        height: 26px;
        flex-basis: 26px;
        margin-left: 2px;
      }
    }

    /* 모바일 카드 뷰 */
    @media (max-width: 600px) {
      /* 드롭다운/필터의 시각적 overflow가 문서 폭을 넓혀 카드 여백이 달라 보이지 않도록 차단 */
      html, body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }
      #results { width: 100%; }
      table { display: none; }
      .tablet-card-list { display: none !important; }
      .card-list {
        width: 100%;
        margin: 0;
        padding: 0 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .card-item {
        width: 100%;
        min-width: 0;
        display: flex;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }
      .card-item .card-image {
        width: 100px;
        height: 100px;
        flex: 0 0 100px;
        background-color: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        overflow: hidden;
      }
      .card-item .card-image img { width: 100%; height: 100%; object-fit: cover; }
      .card-content {
        min-width: 0;
        overflow: hidden;
        padding: 12px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .card-content div {
        min-width: 0;
        margin-bottom: 4px;
        font-size: 14px;
        overflow-wrap: anywhere;
      }
    }

    /* 페이지네이션 */
    #pagination { text-align: center; margin-bottom: 40px; }
    #pagination button {
      background-color: #f2f2f2; border: 1px solid #ccc; color: #333;
      margin: 0 4px; padding: 6px 12px; border-radius: 6px; font-size: 14px; cursor: pointer;
      transition: background-color 0.2s ease;
    }
    #pagination button:hover:not(:disabled) { background-color: #e0e0e0; }
    #pagination button:disabled {
      background-color: #fff; border: 1px solid #ccc; color: #111; font-weight: bold; cursor: default;
    }
    #pagination span { display: inline-block; margin: 0 6px; color: #888; font-size: 14px; }

    /* 모바일: 마지막 카드와 페이지네이션 사이 여백 확보 */
    @media (max-width: 600px) {

    const parts = key.split(".");

    for (const part of parts) value = value?.[part];
    if (value == null) return key;
    let text = String(value);
    Object.entries(replacements).forEach(([name, replacement]) => {
      text = text.replaceAll(`{${name}}`, String(replacement));
    });
    return text;
  }

    return Number(value || 0).toLocaleString(I18N[currentLanguage].locale);

  /* =========================

  function closeFilterMenus(exceptItem = null) {
    document.querySelectorAll(".filter-nav-item.open").forEach(item => {

  function isSevenInchGenre(value) {
    // 7", 7” 등 따옴표 표기가 달라도 7인치 장르로 인식
    return /^\s*7\s*["”″]/.test(String(value || ""));
  }

  function makeFilterOptionButton(select, option) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("role", "menuitem");
    btn.dataset.value = option.value;
    btn.textContent = option.textContent;
    btn.classList.toggle("active", option.value === select.value);
    btn.setAttribute("aria-current", option.value === select.value ? "true" : "false");

    btn.addEventListener("click", e => {
      e.preventDefault();
      e.stopPropagation();
      const changed = select.value !== option.value;
      select.value = option.value;
      closeFilterMenus();
      if (changed) {
        select.dispatchEvent(new Event("change", { bubbles: true }));
      } else {
        refreshFilterNav();
      }
    });
    return btn;
  }

  function renderGenreFilterDropdown(select, dropdown) {
    dropdown.innerHTML = "";
    const options = Array.from(select.options);
    const allOption = options.find(option => option.value === "all");
    const genreOptions = options.filter(option => option.value !== "all");
    const sevenInch = genreOptions.filter(option => isSevenInchGenre(option.value));
    const lpAndTwelve = genreOptions.filter(option => !isSevenInchGenre(option.value));

    // 전체 장르는 두 컬럼 위에 공통 항목으로 배치
    if (allOption) {
      const allWrap = document.createElement("div");
      allWrap.className = "genre-all-wrap";
      allWrap.appendChild(makeFilterOptionButton(select, allOption));
      dropdown.appendChild(allWrap);

    grid.className = "genre-grid";

      const col = document.createElement("div");
      col.className = "genre-column";

      const heading = document.createElement("div");
      heading.className = "genre-group-title";
      heading.textContent = title;
      col.appendChild(heading);

      optionList.forEach(option => col.appendChild(makeFilterOptionButton(select, option)));

    grid.appendChild(createColumn('7"', sevenInch));
    grid.appendChild(createColumn('LP / 12"', lpAndTwelve));

      dateTrigger.addEventListener("keydown", e => {

          dateItem.classList.remove("date-expanded");
          dateTrigger.setAttribute("aria-expanded", "false");

  function parseRefForSort(ref) {
    const raw = String(ref || "").trim().toUpperCase();

    /*
      지원 형태:
      W60527-001   → 영문 + 날짜5자리 + -순번
      OO60524-123  → 영문 여러 개 + 날짜5자리 + -순번
      E50324-123   → 영문 + 날짜5자리 + -순번
      O51123-123   → 영문 + 날짜5자리 + -순번
      W50604143    → 영문 + 날짜5자리 + 순번, 하이픈 없음
      W506041433   → 영문 + 날짜5자리 + 순번, 하이픈 없음

      불규칙 형태:
      7O-0957
      O5-0889
      → 날짜 판독 불가이므로 정렬 뒤쪽으로 보냄
    */

    const match = raw.match(/^([A-Z]+)(\d{5})(?:-?(\d+))?$/);

    if (!match) {
      return {
        isValidDateRef: false,
        dateValue: 0,
        sequenceValue: 0,
        dateString: ""
      };
    }

    const datePart = match[2];
    const sequencePart = match[3] || "0";

    const yearDigit = Number(datePart.slice(0, 1));
    const month = Number(datePart.slice(1, 3));
    const day = Number(datePart.slice(3, 5));

    if (
      !Number.isFinite(yearDigit) ||
      !Number.isFinite(month) ||
      !Number.isFinite(day) ||
      month < 1 ||
      month > 12 ||
      day < 1 ||
      day > 31
    ) {
      return {
        isValidDateRef: false,
        dateValue: 0,
        sequenceValue: 0,
        dateString: ""
      };
    }

    const year = 2020 + yearDigit;
    const dateValue = year * 10000 + month * 100 + day;

    return {
      isValidDateRef: true,
      dateValue,
      sequenceValue: Number(sequencePart) || 0,
      dateString: `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`
    };
  }

  function prepareItem(item) {
    const ref = normalizeSearchText(item["Ref"]);
    const artist = normalizeSearchText(item["Artist"]);
    const title = normalizeSearchText(item["Title"]);
    const label = normalizeSearchText(item["Label"]);
    const tracklist = normalizeSearchText(item["Tracklist"]);
    const credits = normalizeSearchText(item["Credits"]);

    return {
      ...item,
      _sortRef: parseRefForSort(item.Ref),
      _search: {
        ref,
        artist,
        title,
        label,
        tracklist,
        credits,
        all: [ref, artist, title, label, tracklist, credits].join(" ")
      }
    };
  }

  function sortByRefNewestFirst(data) {
    return [...data].sort((a, b) => {
      const refA = a._sortRef || parseRefForSort(a.Ref);
      const refB = b._sortRef || parseRefForSort(b.Ref);

      // 1순위: 날짜를 읽을 수 있는 Ref를 위로
      if (refA.isValidDateRef !== refB.isValidDateRef) {
        return refA.isValidDateRef ? -1 : 1;
      }

      // 2순위: 날짜 최신순
      if (refB.dateValue !== refA.dateValue) {
        return refB.dateValue - refA.dateValue;
      }

      // 3순위: 같은 날짜 안에서는 뒤 번호 큰 순
      if (refB.sequenceValue !== refA.sequenceValue) {
        return refB.sequenceValue - refA.sequenceValue;
      }

      // 4순위: 그 외에는 Ref 문자 기준
      return String(b.Ref || "").localeCompare(String(a.Ref || ""));
    });
  }

  function populateGenreFilter(data) {
    const genreSelect = document.getElementById("genreFilter");
    const previousValue = genreSelect?.value || "all";
    const genreSet = new Set();
    data.forEach(item => {
      const genre = item["Genre"];
      if (genre) genreSet.add(genre.trim());
    });
    genreSelect.innerHTML = `<option value="all">${escapeHtml(t("allGenres"))}</option>`;
    [...genreSet].sort().forEach(genre => {
      const option = document.createElement("option");
      option.value = genre;
      option.textContent = genre;

    genreSelect.value = [...genreSelect.options].some(o => o.value === previousValue) ? previousValue : "all";

  function populateDateFilter(data) {
    const dateFilterBar = document.getElementById("dateFilterBar");
    if (!dateFilterBar) return;

    const selectedStore = document.getElementById("storeFilter")?.value || "all";
    const selectedGenre = document.getElementById("genreFilter")?.value || "all";

    const dateMap = new Map();

    data.forEach(item => {
      const store = String(item.OriginSheet ?? "").trim();
      const genre = String(item["Genre"] ?? "").trim();

      // 현재 선택된 매장에 해당하는 상품의 날짜만 버튼으로 생성
      if (selectedStore !== "all" && store !== selectedStore) return;

      // 현재 선택된 장르에 해당하는 상품의 날짜만 버튼으로 생성
      if (selectedGenre !== "all" && genre !== selectedGenre) return;

      const sortRef = item._sortRef;
      if (!sortRef?.isValidDateRef) return;

      if (!dateMap.has(sortRef.dateValue)) {
        dateMap.set(sortRef.dateValue, sortRef.dateString);
      }
    });

    const dates = [...dateMap.entries()]
      .sort((a, b) => b[0] - a[0])
      .slice(0, 12);

    // 매장/장르 필터 변경 후 현재 선택된 날짜가 더 이상 없으면 날짜 필터 초기화
    const availableDateValues = new Set(dates.map(([dateValue]) => String(dateValue)));
    if (selectedDateValue !== "all" && !availableDateValues.has(String(selectedDateValue))) {
      selectedDateValue = "all";
    }

    let html = `<button type="button" role="menuitem" data-date="all" class="${selectedDateValue === "all" ? "active" : ""}" aria-current="${selectedDateValue === "all" ? "true" : "false"}">${escapeHtml(t("dateAll"))}</button>`;

    dates.forEach(([dateValue, dateString]) => {
      const label = formatDateButtonLabel(dateString);

      html += `<button type="button" role="menuitem" data-date="${dateValue}" class="${active ? "active" : ""}" aria-current="${active ? "true" : "false"}">${label}</button>`;
    });

    dateFilterBar.innerHTML = html;
    refreshDateFilterNav();

    dateFilterBar.querySelectorAll("button").forEach(button => {

        e.preventDefault();
        e.stopPropagation();

  }

  function formatDateButtonLabel(dateString) {
    const parts = String(dateString || "").split("-");

    const month = Number(parts[1]);

    return `${month}/${day}`;

  function conditionShortLabel(value) {
    const raw = String(value ?? "").trim();
    if (!raw) return "";

    const normalized = raw
      .normalize("NFKC")
      .replace(/\s+/g, " ")
      .trim()
      .toUpperCase();

    const exactMap = {
      "GEN": "Gen",
      "GENERIC": "Gen",
      "M": "M",
      "MINT": "M",
      "MINT (M)": "M",
      "NM": "NM",
      "NM OR M-": "NM",
      "NEAR MINT": "NM",
      "NEAR MINT (NM OR M-)": "NM",
      "EX": "EX",
      "EXCELLENT": "EX",
      "EXCELLENT (EX)": "EX",
      "VG+": "VG+",
      "VERY GOOD PLUS": "VG+",
      "VERY GOOD PLUS (VG+)": "VG+",
      "VG": "VG",
      "VERY GOOD": "VG",
      "VERY GOOD (VG)": "VG",
      "G+": "G+",
      "GOOD PLUS": "G+",
      "GOOD PLUS (G+)": "G+",
      "G": "G",
      "GOOD": "G",
      "GOOD (G)": "G",
      "F": "F",
      "FAIR": "F",
      "FAIR (F)": "F"
    };

    let label = exactMap[normalized] || "";

    if (!label) {
      const parenMatch = normalized.match(/\((GEN|M|NM|M-|EX|VG\+|VG|G\+|G|F)(?:\s+OR\s+M-)?\)/);
      if (parenMatch) {
        const token = parenMatch[1];
        if (token === "M-") label = "NM";
        else label = token === "GEN" ? "Gen" : token;
      }
    }

    /* 알 수 없는 표기는 원문 유지 */
    return label || raw;
  }

  function getConditionGuideGrade(label) {
    if (label === "Gen") return "GENERIC";
    return label;
  }

  function getConditionGuide(grade, kind) {
    const group = CONDITION_GUIDE_KO[grade];
    if (!group) return null;
    return group[kind] || null;
  }

  function renderConditionBadge(value, kind = "") {
    const raw = String(value ?? "").trim();
    if (!raw) return "";

    /*
      시트에 약어 또는 Discogs식 전체 등급명이 들어와도
      화면에는 Gen / M / NM / EX / VG+ / VG / G+ / G / F 로만 표시
    */
    const normalized = raw
      .normalize("NFKC")
      .replace(/\s+/g, " ")
      .trim()
      .toUpperCase();

    const exactMap = {
      "GEN": "Gen",
      "GENERIC": "Gen",
      "M": "M",
      "MINT": "M",
      "MINT (M)": "M",
      "NM": "NM",
      "NM OR M-": "NM",
      "NEAR MINT": "NM",
      "NEAR MINT (NM OR M-)": "NM",
      "EX": "EX",
      "EXCELLENT": "EX",
      "EXCELLENT (EX)": "EX",
      "VG+": "VG+",
      "VERY GOOD PLUS": "VG+",
      "VERY GOOD PLUS (VG+)": "VG+",
      "VG": "VG",
      "VERY GOOD": "VG",
      "VERY GOOD (VG)": "VG",
      "G+": "G+",
      "GOOD PLUS": "G+",
      "GOOD PLUS (G+)": "G+",
      "G": "G",
      "GOOD": "G",
      "GOOD (G)": "G",
      "F": "F",
      "FAIR": "F",
      "FAIR (F)": "F"
    };

    let label = exactMap[normalized] || "";

    /* 괄호 안 약어가 포함된 변형 데이터도 대응 */
    if (!label) {
      const parenMatch = normalized.match(/\((GEN|M|NM|M-|EX|VG\+|VG|G\+|G|F)(?:\s+OR\s+M-)?\)/);
      if (parenMatch) {
        const token = parenMatch[1];
        if (token === "M-") label = "NM";
        else label = token === "GEN" ? "Gen" : token;
      }
    }

    if (!label) return escapeHtml(raw);

    const grade = getConditionGuideGrade(label);
    const validKind = kind === "jacket" || kind === "media" ? kind : "";
    const guide = validKind ? getConditionGuide(grade, validKind) : null;

    if (!guide) {
      return `<span class="condition-badge">${escapeHtml(label)}</span>`;
    }

    const ariaKind = validKind === "jacket" ? "자켓" : "미디어";
    const ariaLabel = `${grade} ${ariaKind} 컨디션 설명`;

    return `<span
      class="condition-badge has-condition-guide"
      tabindex="0"
      role="button"
      aria-label="${escapeHtml(ariaLabel)}"
      data-condition-grade="${escapeHtml(grade)}"
      data-condition-kind="${escapeHtml(validKind)}"
    >${escapeHtml(label)}</span>`;
  }

  function updateResultSummary(total, keyword) {
    const summary = document.getElementById("resultSummary");
    if (!summary) return;

    const countText = numberText(total);
    const label = keyword
      ? t("resultSearched", { count: countText })
      : t("resultRecords", { count: countText });

    summary.innerHTML = `<strong>${escapeHtml(label)}</strong>`;
  }

  function filterAndRenderTable() {
    const rawKeyword = document.getElementById("searchInput").value.trim();
    const keyword = normalizeSearchText(rawKeyword);
    const scope = document.getElementById("searchScope").value;
    const selectedStore = document.getElementById("storeFilter").value;
    const selectedGenre = document.getElementById("genreFilter").value;

    const filtered = allData.filter(item => {
      const store = String(item.OriginSheet ?? "").trim();
      const genre = String(item["Genre"] ?? "").trim();

      if (selectedStore !== "all" && store !== selectedStore) return false;
      if (selectedGenre !== "all" && genre !== selectedGenre) return false;

      if (selectedDateValue !== "all") {
        const sortRef = item._sortRef;

        if (
          !sortRef?.isValidDateRef ||
          String(sortRef.dateValue) !== String(selectedDateValue)
        ) {
          return false;
        }
      }

      const s = item._search || {
        ref: normalizeSearchText(item["Ref"]),
        artist: normalizeSearchText(item["Artist"]),
        title: normalizeSearchText(item["Title"]),
        label: normalizeSearchText(item["Label"]),
        tracklist: normalizeSearchText(item["Tracklist"]),
        credits: normalizeSearchText(item["Credits"]),
        all: [
          normalizeSearchText(item["Ref"]),
          normalizeSearchText(item["Artist"]),
          normalizeSearchText(item["Title"]),
          normalizeSearchText(item["Label"]),
          normalizeSearchText(item["Tracklist"]),
          normalizeSearchText(item["Credits"])
        ].join(" ")
      };

      switch (scope) {
        case "Ref": return s.ref.includes(keyword);
        case "Artist": return s.artist.includes(keyword);
        case "Title": return s.title.includes(keyword);
        case "Label": return s.label.includes(keyword);
        case "Tracklist": return s.tracklist.includes(keyword);
        case "Credits": return s.credits.includes(keyword);
        default:
          return s.all.includes(keyword);
      }
    });

    window.currentSearchKeyword = rawKeyword;
    updateResultSummary(filtered.length, rawKeyword);

    currentPage = 1;
    renderTable(filtered);
  }

  function renderTable(data) {
    const results = document.getElementById("results");
    const pagination = document.getElementById("pagination");

    if (data.length === 0) {
      const searched = String(window.currentSearchKeyword || "").trim();
      const safeKeyword = escapeHtml(searched);

      const message = searched
        ? t("noResultsFor", { keyword: searched })
        : t("noResultsFiltered");

      results.innerHTML = `<div style="text-align:center; margin:40px 0; font-size:16px; color:#777;">
        ${escapeHtml(message)}
      </div>`;

      pagination.innerHTML = "";
      removeFloatingTableHeader();
      return;
    }

    const start = (currentPage - 1) * itemsPerPage;
    const end = start + itemsPerPage;
    const pageData = data.slice(start, end);

    let html = "";

    if (window.innerWidth <= 600) {

              ${badgeHtml}

        html += `

            <div class="card-content">
              <div style="color:#777; font-size:12px;">${escapeHtml(item.Ref || "")}</div>
              <div><strong>${escapeHtml(item.Artist || "")}</strong> - ${escapeHtml(item.Title || "")}</div>
              <div>${escapeHtml(item.Pressing || "")}</div>
              <div>${renderConditionBadge(item["Condition Jacket"] || "", "jacket")} / ${renderConditionBadge(item["Condition Media"] || "", "media")}</div>
              <div><strong>₩${Number(item["Selling at"] || 0).toLocaleString()}</strong></div>
            </div>
          </div>`;
      });
      html += `</div>`;
    } else {
      /* 태블릿/데스크톱 공통 테이블 뷰 */
      html = `<div class="table-wrapper"><table><thead><tr>`;
      displayOrder.forEach(key => { html += `<th data-col="${escapeHtml(key)}">${allDisplayNames[key] || key}</th>`; });
      html += `</tr></thead><tbody>`;

      pageData.forEach((row, idx) => {
        html += `<tr>`;
        displayOrder.forEach(key => {
          if (key === "Image") {
            const imageURL = getMainImageUrl(row["Image URL"]);
            const storeBadge = getStoreBadge(row.OriginSheet);
            const badgeHtml = storeBadge ? `<span class="store-badge">${storeBadge}</span>` : "";

            const imgHtml = imageURL
              ? `<div class="table-image image-badge-wrap" onclick="showDetails(${start + idx})">
                  ${badgeHtml}
                  <img src="${imageURL}" alt="${escapeHtml(t("imageAlt"))}" loading="lazy">
                </div>`
              : `<div class="table-image image-badge-wrap" onclick="showDetails(${start + idx})">
                  ${badgeHtml}
                  <span class="no-image">NO IMAGE</span>
                </div>`;

            html += `<td class="image-cell" data-col="Image">${imgHtml}</td>`;
            return;
          }
          let cell = row[key] ?? "";
          if (key === "Condition Jacket" || key === "Condition Media") {
            const conditionKind = key === "Condition Jacket" ? "jacket" : "media";
            html += `<td data-col="${escapeHtml(key)}">${renderConditionBadge(cell, conditionKind)}</td>`;
            return;
          }
          if (key === "Selling at" && !isNaN(cell)) cell = Number(cell).toLocaleString();
          if (key === "Details") cell = `<button onclick="showDetails(${start + idx})">${escapeHtml(t("details"))}</button>`;
          html += `<td data-col="${escapeHtml(key)}">${key === "Details" ? cell : escapeHtml(cell)}</td>`;
        });
        html += `</tr>`;
      });
      html += `</tbody></table></div>`;
    }

    results.innerHTML = html;
    renderPagination(data.length);

    requestAnimationFrame(() => {
      if (window.innerWidth > 600) {
        setupFloatingTableHeader();
      } else {
        removeFloatingTableHeader();
      }
    });
  }

  function removeFloatingTableHeader() {
    if (window._floatingHeaderCleanup) {
      window._floatingHeaderCleanup();
      window._floatingHeaderCleanup = null;
    }
    document.querySelectorAll(".floating-table-header").forEach(el => el.remove());
  }

  function setupFloatingTableHeader() {
    removeFloatingTableHeader();

    const wrapper = document.querySelector(".table-wrapper");
    const table = wrapper?.querySelector("table");
    const thead = table?.querySelector("thead");
    if (!wrapper || !table || !thead) return;

    const floating = document.createElement("div");
    floating.className = "floating-table-header";
    floating.setAttribute("aria-hidden", "true");

    const cloneTable = document.createElement("table");
    const cloneHead = thead.cloneNode(true);
    cloneTable.appendChild(cloneHead);
    floating.appendChild(cloneTable);
    document.body.appendChild(floating);

    const syncSizes = () => {
      if (!document.body.contains(floating)) return;

      const wrapperRect = wrapper.getBoundingClientRect();
      const originalThs = thead.querySelectorAll("th");
      const cloneThs = cloneHead.querySelectorAll("th");

      floating.style.left = `${wrapperRect.left}px`;
      floating.style.width = `${wrapperRect.width}px`;
      cloneTable.style.width = `${table.scrollWidth}px`;
      cloneTable.style.transform = `translateX(${-wrapper.scrollLeft}px)`;

      originalThs.forEach((th, i) => {
        const width = th.getBoundingClientRect().width;
        if (cloneThs[i]) {
          cloneThs[i].style.width = `${width}px`;
          cloneThs[i].style.minWidth = `${width}px`;
          cloneThs[i].style.maxWidth = `${width}px`;
        }
      });
    };

    const updateVisibility = () => {
      if (!document.body.contains(floating)) return;

      const tableRect = table.getBoundingClientRect();
      const headRect = thead.getBoundingClientRect();
      const floatingHeight = floating.offsetHeight || headRect.height;

      const shouldShow =
        headRect.bottom <= 0 &&
        tableRect.bottom > floatingHeight;

      floating.classList.toggle("visible", shouldShow);

      if (shouldShow) {
        const wrapperRect = wrapper.getBoundingClientRect();
        floating.style.left = `${wrapperRect.left}px`;
        floating.style.width = `${wrapperRect.width}px`;
        cloneTable.style.transform = `translateX(${-wrapper.scrollLeft}px)`;
      }
    };

    const onScroll = () => updateVisibility();
    const onHorizontalScroll = () => {
      cloneTable.style.transform = `translateX(${-wrapper.scrollLeft}px)`;
    };
    const onResize = () => {
      syncSizes();
      updateVisibility();
    };

    syncSizes();
    updateVisibility();

    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onResize);
    wrapper.addEventListener("scroll", onHorizontalScroll, { passive: true });

    window._floatingHeaderCleanup = () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onResize);
      wrapper.removeEventListener("scroll", onHorizontalScroll);
      floating.remove();
    };
  }

  /* Condition Comment 앞의 중복 ● 정리 */
  function normalizeConditionComment(value) {
    return String(value || "")
      .trim()

  /* =========================
     Condition Grade Guide Popover
     Desktop: hover/focus
     Mobile/Tablet: tap
     ========================= */
  let activeConditionGuideBadge = null;
  let conditionGuideHideTimer = null;

  function getConditionGuidePopoverElements() {
    return {
      popover: document.getElementById("conditionGuidePopover"),
      meta: document.getElementById("conditionGuideMeta"),
      title: document.getElementById("conditionGuideTitle"),
      description: document.getElementById("conditionGuideDescription")
    };
  }

  function positionConditionGuidePopover(anchor) {
    const { popover } = getConditionGuidePopoverElements();
    if (!popover || !anchor) return;

    const anchorRect = anchor.getBoundingClientRect();
    const viewportWidth = window.innerWidth || document.documentElement.clientWidth;
    const viewportHeight = window.innerHeight || document.documentElement.clientHeight;
    const edge = 12;
    const gap = 8;

    /*
      크기를 측정하기 위해 visibility는 유지한 채 is-open 상태에서 계산.
      fixed 배치이므로 테이블/모달 overflow에 잘리지 않음.
    */
    const popRect = popover.getBoundingClientRect();

    let left = anchorRect.left + (anchorRect.width / 2) - (popRect.width / 2);
    left = Math.max(edge, Math.min(left, viewportWidth - popRect.width - edge));

    let top = anchorRect.bottom + gap;
    let placement = "bottom";

    if (top + popRect.height > viewportHeight - edge) {
      top = anchorRect.top - popRect.height - gap;
      placement = "top";
    }

    /*
      위/아래 모두 부족한 작은 모바일 화면에서는
      viewport 안에 강제로 들어오도록 위치 제한.
    */
    top = Math.max(edge, Math.min(top, viewportHeight - popRect.height - edge));

    popover.style.left = `${Math.round(left)}px`;
    popover.style.top = `${Math.round(top)}px`;
    popover.dataset.placement = placement;
  }

  function showConditionGuidePopover(badge) {
    if (!badge) return;

    const grade = badge.dataset.conditionGrade || "";
    const kind = badge.dataset.conditionKind || "";
    const guide = getConditionGuide(grade, kind);
    if (!guide) return;

    if (conditionGuideHideTimer) {
      clearTimeout(conditionGuideHideTimer);
      conditionGuideHideTimer = null;
    }

    if (activeConditionGuideBadge && activeConditionGuideBadge !== badge) {
      activeConditionGuideBadge.classList.remove("is-guide-active");
      activeConditionGuideBadge.setAttribute("aria-expanded", "false");
    }

    const { popover, meta, title, description } = getConditionGuidePopoverElements();
    if (!popover || !meta || !title || !description) return;

    const kindLabel = kind === "jacket" ? "자켓" : "미디어";

    meta.textContent = `${grade} · ${kindLabel}`;
    title.textContent = guide.title;
    description.textContent = guide.description;

    activeConditionGuideBadge = badge;
    badge.classList.add("is-guide-active");
    badge.setAttribute("aria-expanded", "true");

    popover.classList.add("is-open");
    popover.setAttribute("aria-hidden", "false");

    requestAnimationFrame(() => {
      positionConditionGuidePopover(badge);
    });
  }

  function hideConditionGuidePopover() {
    if (conditionGuideHideTimer) {
      clearTimeout(conditionGuideHideTimer);
      conditionGuideHideTimer = null;
    }

    const { popover } = getConditionGuidePopoverElements();

    if (activeConditionGuideBadge) {
      activeConditionGuideBadge.classList.remove("is-guide-active");
      activeConditionGuideBadge.setAttribute("aria-expanded", "false");
      activeConditionGuideBadge = null;
    }

    if (popover) {
      popover.classList.remove("is-open");
      popover.setAttribute("aria-hidden", "true");
    }
  }

  function scheduleConditionGuideHide(delay = 80) {
    if (conditionGuideHideTimer) clearTimeout(conditionGuideHideTimer);

    conditionGuideHideTimer = window.setTimeout(() => {
      hideConditionGuidePopover();
    }, delay);
  }

  /* 데스크톱 마우스 hover */
  document.addEventListener("mouseover", event => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

    const badge = event.target.closest(".condition-badge.has-condition-guide");
    if (!badge) return;

    showConditionGuidePopover(badge);
  });

  document.addEventListener("mouseout", event => {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;

    const badge = event.target.closest(".condition-badge.has-condition-guide");
    if (!badge) return;

    scheduleConditionGuideHide(90);
  });

  /* 키보드 접근 */
  document.addEventListener("focusin", event => {
    const badge = event.target.closest?.(".condition-badge.has-condition-guide");
    if (badge) showConditionGuidePopover(badge);
  });

  document.addEventListener("focusout", event => {
    const badge = event.target.closest?.(".condition-badge.has-condition-guide");
    if (badge) scheduleConditionGuideHide(80);
  });

  /*
    모바일/태블릿 tap.

    const media = item["Condition Media"] || "";

    const price = isNaN(priceN) ? "" : priceN.toLocaleString(I18N[currentLanguage].locale);

    const cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const alreadyInCart = cart.some(c => String(c.ref) === String(ref));

    let info = `<div class="info-block">`;
    if (store) {
      info += `<p class="store-shelf-row"><span class="store-info-part"><strong>${escapeHtml(t("store"))} :</strong> ${escapeHtml(store)}</span>`;
      if (shelfLocation) {
        info += `<span class="shelf-info-part"> <span class="info-inline-divider">/</span> <strong>${escapeHtml(t("shelfLocation"))} :</strong> <span class="shelf-location-value">${escapeHtml(shelfLocation)}</span></span>`;
      }
      info += `</p>`;
    }
    if (pressing) info += `<p><strong>${escapeHtml(t("pressing"))} :</strong> ${escapeHtml(pressing)}</p>`;
    if (jacket || media) info += `<p><strong>${escapeHtml(t("jacket"))}:</strong> ${renderConditionBadge(jacket || "-", "jacket")} <strong>/ ${escapeHtml(t("media"))}:</strong> ${renderConditionBadge(media || "-", "media")}</p>`;
    const cleanComment = normalizeConditionComment(comment);
    if (cleanComment) info += `<p>● ${escapeHtml(cleanComment)}</p>`;
    if (price) info += `<p><strong>${escapeHtml(t("price"))} :</strong> ₩${price}</p>`;

    info += `<div class="info-block-cart-action">
      ${alreadyInCart
        ? `<button id="modalCartBtn" class="modal-cart-button is-added" disabled>${escapeHtml(t("inCart"))}</button>`
        : `<button id="modalCartBtn" class="modal-cart-button" onclick="addToCart(${index})">${escapeHtml(t("addToCart"))}</button>`
      }
    </div>`;

    info += `</div>`;
    content += info;

      const url = item.Youtube.trim();
      let embedUrl = "";
      if (url.includes("youtube.com/watch?v=")) {
        embedUrl = `https://www.youtube.com/embed/${url.split("v=")[1].split("&")[0]}`;
      } else if (url.includes("youtu.be/")) {
        embedUrl = `https://www.youtube.com/embed/${url.split("youtu.be/")[1].split("?")[0]}`;
      }
      if (embedUrl) {
        content += `<p><strong>YouTube:</strong><br><div class="video-wrapper"><iframe src="${embedUrl}" frameborder="0" allowfullscreen></iframe></div></p>`;

  function debounce(func, delay = 300) {
    let timeout;
    return function (...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), delay);
    };
  }

  window.addEventListener("resize", debounce(() => {
    if (window.currentData?.length > 0) {
      renderTable(window.currentData);
    } else {
      filterAndRenderTable();
    }
  }, 300));

  function renderPagination(totalItems) {
    const totalPages = Math.ceil(totalItems / itemsPerPage);
    const pagination = document.getElementById("pagination");
    let html = "";

    if (totalPages <= 1) {
      pagination.innerHTML = "";
      scheduleUtilityBarUpdate();
      return;
    }

    html += `<button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>${escapeHtml(t("prev"))}</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
        html += `<button onclick="goToPage(${i})" ${i === currentPage ? 'disabled' : ''}>${i}</button>`;
      } else if ((i === 2 && currentPage - 3 > 1) || (i === totalPages - 1 && currentPage + 3 < totalPages)) {
        html += `<span style="margin:0 4px;">...</span>`;
      }
    }
    html += `<button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>${escapeHtml(t("next"))}</button>`;
    pagination.innerHTML = html;
    scheduleUtilityBarUpdate();
  }

  function goToPage(page) {
    currentPage = page;
    renderTable(window.currentData);

    requestAnimationFrame(() => {
      const firstItem = window.innerWidth <= 600
        ? document.querySelector(".card-list .card-item")
        : document.querySelector(".table-wrapper tbody tr");

      if (!firstItem) return;

      const headerOffset = window.innerWidth <= 600 ? 16 : 72;
      const targetTop = window.scrollY + firstItem.getBoundingClientRect().top - headerOffset;

      window.scrollTo({
        top: Math.max(0, targetTop),
        behavior: "smooth"
      });
    });
  }

  /* 장바구니 */

  function getCartShelfLocation(cartItem, fullRecord) {

  function renderCartModalBody() {
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const cartBody = document.getElementById("cartBody");
    if (!cartBody) return;

    if (cart.length === 0) {
      cartBody.innerHTML = `<p>${escapeHtml(t("cartEmpty"))}</p>`;

    const itemsHtml = cart.map((item, idx) => {
      total += item.price || 0;

      const full = getCartFullRecord(item);
      const imageURL = getMainImageUrl(full["Image URL"] || item.imageURL || "");
      const store = String(full.OriginSheet ?? item.store ?? "").trim();
      const shelfLocation = getCartShelfLocation(item, full);
      const pressing = String(full.Pressing ?? item.pressing ?? "").trim();
      const jacket = full["Condition Jacket"] ?? item.jacket ?? "";

             ${store && shelfLocation ? `<span class="location-divider">/</span>` : ""}
             ${shelfLocation ? `<strong>${escapeHtml(t("shelfLocation"))} :</strong> ${escapeHtml(shelfLocation)}` : ""}

      return `

          <label class="cart-card-select" aria-label="${escapeHtml(t("deleteSelected"))}">
            <input type="checkbox" class="cart-item-checkbox" data-index="${idx}">

    cartBody.innerHTML = `

  function buildCartPlainText(items) {
    let total = 0;

    const blocks = items.map(c => {
      total += Number(c.price || 0);

      const full = findCartFullRecordByRef(c.ref);
      const store = String(full.OriginSheet ?? c.store ?? "").trim();
      const pressing = String(full.Pressing ?? c.pressing ?? "").trim();
      const jacket = full["Condition Jacket"] ?? c.jacket ?? "";
      const media = full["Condition Media"] ?? c.media ?? "";

      const shelfLocation = store.toUpperCase() === "ONLINE"
        ? t("onlineShelfLocation")
        : String(full["Subcategory"] ?? c.subcategory ?? "").trim();

      const lines = [
        `[${c.ref || ""}] ${c.artist || ""} - ${c.title || ""}`,
        `${t("store")} : ${store || "-"}${shelfLocation ? ` / ${t("shelfLocation")} : ${shelfLocation}` : ""}`,
        `${t("pressing")} : ${pressing || "-"}`,
        `${t("jacket")} : ${conditionShortLabel(jacket) || "-"} / ${t("media")} : ${conditionShortLabel(media) || "-"}`,
        `${t("price")} : ₩${Number(c.price || 0).toLocaleString(I18N[currentLanguage].locale)}`
      ];

      return lines.join("\n");
    });

    return [
      "MOSAIC PICK LIST",
      "",
      blocks.join("\n\n"),
      "",
      t("printTotal", {
        count: numberText(items.length),
        total: numberText(total)
      })
    ].join("\n");
  }

  async function writeClipboardText(textValue) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(textValue);
      return;
    }

    /* HTTP/구형 모바일 브라우저용 fallback */
    const textarea = document.createElement("textarea");
    textarea.value = textValue;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    textarea.style.top = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    const copied = document.execCommand("copy");
    textarea.remove();

    if (!copied) throw new Error("copy failed");
  }

  async function copyCartToClipboard() {
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");
    if (cart.length === 0) {
      showToast(t("cartEmpty"));
      return;
    }

    const checked = Array.from(
      document.querySelectorAll(".cart-item-checkbox:checked")
    );

    const selectedIndices = checked
      .map(cb => Number(cb.dataset.index))
      .filter(Number.isInteger);

    const itemsToCopy = selectedIndices.length
      ? selectedIndices.map(index => cart[index]).filter(Boolean)
      : cart;

    try {
      const message = buildCartPlainText(itemsToCopy);
      await writeClipboardText(message);

      if (selectedIndices.length) {
        showToast(t("copySelectedDone", {
          count: numberText(itemsToCopy.length)
        }));
      } else {
        showToast(t("copyDone"));
      }
    } catch (error) {
      console.error("Clipboard copy failed:", error);
      showToast(t("copyFailed"));
    }
  }

  function addToCart(index) {
    const item = window.currentData[index];
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");

    const exists = cart.some(c => String(c.ref) === String(item.Ref));
    if (exists) {
      showToast(t("alreadyInCart"));
      setModalCartButtonAdded();
      return;
    }

    const price = Number(item["Selling at"] || 0);
    const newItem = {
      ref: item.Ref || "",
      artist: item.Artist || "",
      title: item.Title || "",
      jacket: item["Condition Jacket"] || "",
      media: item["Condition Media"] || "",
      pressing: item.Pressing || "",
      price: price,
      store: item.OriginSheet || "",
      subcategory: item["Subcategory"] || "",
      imageURL: getMainImageUrl(item["Image URL"])
    };

    cart.push(newItem);
    localStorage.setItem("cart", JSON.stringify(cart));

    updateCartCount();
    setModalCartButtonAdded();
    showToast(t("addedToCart"));
  }

  function setModalCartButtonAdded() {
    const btn = document.getElementById("modalCartBtn");
    if (!btn) return;

    btn.disabled = true;
    btn.textContent = t("inCart");
    btn.classList.add("is-added");
    btn.onclick = null;
  }

  function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const count = cart.length;

    document.querySelectorAll(".cart-count").forEach(el => {
      el.textContent = count;
    });

    const cartButton = document.getElementById("viewCartBtn");
    if (cartButton) {
      const previous = cartButton.dataset.cartCount;

      if (previous !== undefined && previous !== String(count)) {
        cartButton.classList.remove("count-pop");
        void cartButton.offsetWidth;
        cartButton.classList.add("count-pop");
        window.setTimeout(() => cartButton.classList.remove("count-pop"), 240);
      }

      cartButton.dataset.cartCount = String(count);

      /* 상품 추가/삭제 직후에는 모바일·태블릿에서도 CART 수량을 잠시 보여줌 */
      if (previous !== undefined && previous !== String(count)) {
        revealUtilityBarTemporarily(2200);
      }
    }
  }

  let toastTimer = null;
  function showToast(message) {
    const container = document.getElementById("toastContainer");
    if (!container) return;

    if (toastTimer) clearTimeout(toastTimer);

    container.innerHTML = `<div class="toast">${escapeHtml(message)}</div>`;
    const toast = container.firstElementChild;

    requestAnimationFrame(() => {
      toast.classList.add("show");
    });

    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => {
        if (container.contains(toast)) toast.remove();
      }, 220);
    }, 1800);
  }

  function deleteSelectedCartItems() {
    const checkboxes = document.querySelectorAll(".cart-item-checkbox:checked");
    if (checkboxes.length === 0) { alert(t("selectDelete")); return; }
    if (!confirm(t("confirmDelete"))) return;

    const cart = JSON.parse(localStorage.getItem("cart") || "[]");
    const updatedCart = cart.filter((_, idx) => {
      return !Array.from(checkboxes).some(cb => Number(cb.dataset.index) === idx);
    });

    localStorage.setItem("cart", JSON.stringify(updatedCart));
    updateCartCount();
    showToast(t("deleted"));
    renderCartModalBody();
  }

  function monitorCartCheckboxes() {
    const checkboxes = document.querySelectorAll(".cart-item-checkbox");
    const deleteBtn = document.getElementById("deleteSelectedBtn");
    const copyBtn = document.getElementById("copyCartBtn");

    const updateSelectionActions = () => {
      const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
      const anyChecked = checkedCount > 0;

      if (deleteBtn) deleteBtn.disabled = !anyChecked;
      if (copyBtn) {
        copyBtn.textContent = anyChecked ? t("copySelected") : t("copyText");
      }
    };

    checkboxes.forEach(cb => {
      cb.addEventListener("change", updateSelectionActions);
    });

    updateSelectionActions();
  }

  /* =========================
     Floating Utility Bar
     - 모바일/태블릿: 활동 중 표시 → 정지 후 자동 숨김
     - 데스크톱: 항상 표시
     ========================= */
  let utilityBarRaf = 0;
  let utilityBarHideTimer = null;
  const UTILITY_IDLE_HIDE_MS = 1400;

  function isCompactUtilityViewport() {
    return window.matchMedia("(max-width: 1024px)").matches;
  }

  function showUtilityBarNow() {
    const bar = document.getElementById("utilityBar");
    if (!bar) return;

    bar.classList.remove("auto-hidden");
  }

  function hideUtilityBarNow() {
    const bar = document.getElementById("utilityBar");
    if (!bar || !isCompactUtilityViewport()) return;

    bar.classList.add("auto-hidden");
  }

  function revealUtilityBarTemporarily(duration = UTILITY_IDLE_HIDE_MS) {
    const bar = document.getElementById("utilityBar");
    if (!bar) return;

    if (utilityBarHideTimer) {
      clearTimeout(utilityBarHideTimer);
      utilityBarHideTimer = null;
    }

    /*
      데스크톱에서는 항상 표시.
      모바일/태블릿에서만 일정 시간 뒤 자동으로 숨김.
    */
    bar.classList.remove("auto-hidden");

    if (!isCompactUtilityViewport()) return;

    utilityBarHideTimer = window.setTimeout(() => {
      hideUtilityBarNow();
      utilityBarHideTimer = null;
    }, duration);
  }

  function updateUtilityBarState() {
    utilityBarRaf = 0;

    const bar = document.getElementById("utilityBar");
    if (!bar) return;

    const isMobile = window.matchMedia("(max-width: 600px)").matches;
    const showTop = window.scrollY > 420;

    bar.classList.toggle("show-top", showTop);

    let paginationNear = false;

    if (isMobile) {
      const pagination = document.getElementById("pagination");

      if (pagination && pagination.children.length > 0) {
        const rect = pagination.getBoundingClientRect();
        const viewportHeight = window.innerHeight || document.documentElement.clientHeight;

        paginationNear =
          rect.top < viewportHeight - 6 &&
          rect.bottom > 0;

        if (paginationNear) {
          /*
            바의 아래쪽이 페이지네이션의 위쪽보다 12px 위에 오도록 계산.
            따라서 페이지 번호/이전/다음 버튼을 가리지 않음.
          */
          const calculatedBottom = Math.max(
            86,
            viewportHeight - rect.top + 12
          );

          bar.style.setProperty(
            "--utility-mobile-bottom",
            `${Math.round(calculatedBottom)}px`
          );
        } else {
          bar.style.removeProperty("--utility-mobile-bottom");
        }
      } else {
        bar.style.removeProperty("--utility-mobile-bottom");
      }
    } else {
      bar.style.removeProperty("--utility-mobile-bottom");
    }

    bar.classList.toggle("pagination-near", paginationNear);

    /*
      화면이 데스크톱으로 넓어졌다면 auto-hidden 상태를 즉시 해제.
      태블릿/모바일로 돌아오면 다음 활동 이후 다시 자동 숨김.
    */
    if (!isCompactUtilityViewport()) {
      if (utilityBarHideTimer) {
        clearTimeout(utilityBarHideTimer);
        utilityBarHideTimer = null;
      }
      bar.classList.remove("auto-hidden");
    }
  }

  function scheduleUtilityBarUpdate() {
    if (utilityBarRaf) return;
    utilityBarRaf = window.requestAnimationFrame(updateUtilityBarState);
  }

  function handleUtilityScrollActivity() {
    revealUtilityBarTemporarily();
    scheduleUtilityBarUpdate();
  }

  function scrollToPageTop() {
    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  window.addEventListener("scroll", handleUtilityScrollActivity, { passive: true });

  window.addEventListener("resize", () => {
    scheduleUtilityBarUpdate();

    if (isCompactUtilityViewport()) {
      revealUtilityBarTemporarily();
    } else {
      showUtilityBarNow();
    }
  });

  document.addEventListener("DOMContentLoaded", () => {
    const topBtn = document.getElementById("utilityTopBtn");
    if (topBtn) topBtn.addEventListener("click", scrollToPageTop);

    const pagination = document.getElementById("pagination");
    if (pagination && "MutationObserver" in window) {
      const observer = new MutationObserver(scheduleUtilityBarUpdate);
      observer.observe(pagination, {
        childList: true,
        subtree: true
      });
    }

    scheduleUtilityBarUpdate();

    /*
      처음 페이지를 열었을 때는 기능 위치를 인지할 수 있도록 잠시 보여준 뒤,
      모바일/태블릿에서만 자동으로 숨김.
    */
    if (isCompactUtilityViewport()) {
      revealUtilityBarTemporarily(1800);
    } else {
      showUtilityBarNow();
    }
  });

  /* =========================
     🖨 인쇄하기 기능 추가
     ========================= */
  function printCart() {
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");
    if (cart.length === 0) { alert(t("cartEmpty")); return; }

    /* 용지 폭(mm) — 필요 시 값만 변경 */
    const RECEIPT_WIDTH_MM = 58;

    const findFullByRef = (ref) => (window.allData || []).find(d => String(d.Ref) === String(ref)) || {};

    let total = 0;
    const itemsHtml = cart.map((c, i) => {
      total += c.price || 0;

      const full = findFullByRef(c.ref);
      const store = String(full.OriginSheet ?? c.store ?? "").trim();
      const pressing = String(full.Pressing ?? c.pressing ?? "").trim();
      const jacket = full["Condition Jacket"] ?? c.jacket ?? "";
      const media = full["Condition Media"] ?? c.media ?? "";

      // ONLINE은 현재 선택된 언어의 고정 진열 위치 안내 사용
      const shelfLocation = store.toUpperCase() === "ONLINE"
        ? t("onlineShelfLocation")
        : String(full["Subcategory"] ?? c.subcategory ?? "").trim();

      return `
<div class="item">
  <div class="title"><strong>[${escapeHtml(c.ref)}] ${escapeHtml(c.artist)} - ${escapeHtml(c.title)}</strong></div>
  <div><strong>${escapeHtml(t("store"))} :</strong> ${escapeHtml(store || "-")}${shelfLocation ? ` / <strong>${escapeHtml(t("shelfLocation"))} :</strong> ${escapeHtml(shelfLocation)}` : ""}</div>
  <div><strong>${escapeHtml(t("pressing"))} :</strong> ${escapeHtml(pressing || "-")}</div>
  <div><strong>${escapeHtml(t("jacket"))} :</strong> ${escapeHtml(conditionShortLabel(jacket) || "-")} / <strong>${escapeHtml(t("media"))} :</strong> ${escapeHtml(conditionShortLabel(media) || "-")}</div>
  <div><strong>${escapeHtml(t("price"))} :</strong> ₩${(c.price || 0).toLocaleString(I18N[currentLanguage].locale)}</div>
</div>
<hr/>`;
    }).join("");

    const html = `<!DOCTYPE html>
<html lang="${I18N[currentLanguage].htmlLang}"><head><meta charset="utf-8">
<title>MOSAIC PICK LIST</title>
<style>
@page { size: ${RECEIPT_WIDTH_MM}mm auto; margin: 5mm; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
  font-size: 12px; line-height: 1.35;
  width: ${RECEIPT_WIDTH_MM}mm; margin: 0 auto;
}
h1 { font-size: 14px; text-align:center; margin: 0 0 8px; }
hr { border: 0; border-top: 1px dashed #999; margin: 8px 0; }
.item { margin-bottom: 6px; }
.title { margin-bottom: 5px; line-height: 1.4; }
.item > div:not(.title) { margin: 2px 0; }
.footer { margin-top: 10px; border-top: 1px solid #000; padding-top: 8px; }
@media print { body { margin: 0; } }
</style></head>
<body>
  <h1>MOSAIC PICK LIST</h1>
  ${itemsHtml}
  <div class="footer">${escapeHtml(t("printTotal", { count: numberText(cart.length), total: numberText(total) }))}</div>
</body></html>`;

    const w = window.open("", "_blank", "width=480,height=640");
    if (!w) { alert(t("popupBlocked")); return; }
    w.document.open();
    w.document.write(html);
    w.document.close();
    w.focus();
    setTimeout(() => { try { w.print(); } catch(e) {} }, 300);
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  /* 홈(초기화) 이동: 로고 클릭 시 실행 */
  function goHome() {
    // 1) 검색어/필터 초기화
    const storeSel  = document.getElementById("storeFilter");
    const genreSel  = document.getElementById("genreFilter");
    const scopeSel  = document.getElementById("searchScope");
    const input     = document.getElementById("searchInput");

    if (storeSel) storeSel.value = "all";
    if (genreSel) genreSel.value = "all";
    if (scopeSel) scopeSel.value = "all";
    if (input)    input.value = "";
    selectedDateValue = "all";
    refreshFilterNav();
    populateDateFilter(allData);

    // 2) 페이지 초기화 + 렌더
    currentPage = 1;
    filterAndRenderTable();

    // 3) 모달 열려 있으면 닫기
    const modal = document.getElementById("detailModal");
    if (modal) modal.style.display = "none";

    // 4) 맨 위로 스크롤
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* 로고 클릭 핸들러 연결 */
  document.addEventListener("DOMContentLoaded", () => {
    const logo = document.getElementById("brandLogo");
    if (logo) logo.addEventListener("click", goHome);
  });
  </script>
